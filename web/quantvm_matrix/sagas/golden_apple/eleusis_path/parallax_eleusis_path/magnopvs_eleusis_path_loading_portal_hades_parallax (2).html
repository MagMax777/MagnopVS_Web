<html class="dark" lang="en"><head>

<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Eleusis Path - Cinematic Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="./catabasis-audio.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const logo =
        document.getElementById(
            "eleusisLogo"
        );

    const video =
        document.getElementById(
            "bg-video"
        );

    const foreground =
        document.getElementById(
            "parallax-fg"
        );

    const progressBar =
        document.getElementById(
            "progress-bar"
        );

    const percentage =
        document.getElementById(
            "loading-percentage"
        );

    const status =
        document.getElementById(
            "loading-status"
        );


    /* =========================================
       INITIAL STATE
       ========================================= */

    let experienceStarted =
        false;


    /* =========================================
       LOGO = PORTAL
       ========================================= */

    if (logo) {

        logo.addEventListener(
            "click",
            async () => {

                if (experienceStarted)
                    return;


                experienceStarted =
                    true;


                console.log(
                    "🜏 ELEUSIS PORTAL ACTIVATED"
                );


                /* ---------------------------------
                   VISUAL ACTIVATION
                   --------------------------------- */

                logo.classList.add(
                    "portal-opening"
                );


                if (foreground) {

                    foreground.classList.add(
                        "portal-active"
                    );

                }


                /* ---------------------------------
                   VIDEO
                   --------------------------------- */

                if (video) {

                    video.currentTime =
                        0;

                    video.playbackRate =
                        0.16;

                    try {

                        await video.play();

                        console.log(
                            "🎥 VIDEO STARTED"
                        );

                    } catch (error) {

                        console.warn(
                            "Video error:",
                            error
                        );

                    }

                }


                /* ---------------------------------
                   AUDIO
                   
                   THIS IS THE IMPORTANT PART.
                   
                   It happens INSIDE the user's
                   click event, so Chrome allows
                   AudioContext to start.
                   --------------------------------- */

                if (
                    window.CatabasisAudio
                ) {

                    try {

                        await
                            window.CatabasisAudio.start();

                        console.log(
                            "🎧 CATÁBASIS STARTED"
                        );

                    } catch (error) {

                        console.error(
                            "Audio error:",
                            error
                        );

                    }

                }


                /* ---------------------------------
                   LOADING STATUS
                   --------------------------------- */

                if (status) {

                    status.textContent =
                        "DESCENDING INTO TARTARUS...";

                }


                /* ---------------------------------
                   RESET PROGRESS
                   --------------------------------- */

                if (progressBar) {

                    progressBar.style.width =
                        "0%";

                }


                if (percentage) {

                    percentage.textContent =
                        "0%";

                }


                /* ---------------------------------
                   15 SECOND SYNCHRONIZATION
                   --------------------------------- */

                const start =
                    performance.now();

                const duration =
                    15000;


                function updateProgress(
                    now
                ) {

                    const elapsed =
                        now - start;


                    let progress =
                        elapsed /
                        duration;


                    if (progress > 1)
                        progress = 1;


                    const percent =
                        Math.floor(
                            progress * 100
                        );


                    if (progressBar) {

                        progressBar.style.width =
                            percent + "%";

                    }


                    if (percentage) {

                        percentage.textContent =
                            percent + "%";

                    }


                    if (progress < 1) {

                        requestAnimationFrame(
                            updateProgress
                        );

                    } else {

                        finishCycle();

                    }

                }


                requestAnimationFrame(
                    updateProgress
                );


            },
            {
                passive: true
            }
        );

    }


    /* =========================================
       FINISH 15 SECOND CYCLE
       ========================================= */

    function finishCycle() {

        console.log(
            "🜏 CATÁBASIS COMPLETE"
        );


        if (status) {

            status.textContent =
                "THE GATE AWAITS...";

        }


        /*
         * Reiniciamos el video para que
         * el siguiente ciclo empiece
         * exactamente desde el principio.
         */

        if (video) {

            video.currentTime =
                0;

        }


        /*
         * Reiniciamos la barra.
         */

        if (progressBar) {

            progressBar.style.width =
                "0%";

        }


        if (percentage) {

            percentage.textContent =
                "0%";

        }


        /*
         * El audio ya tiene su propio
         * ciclo de 15 segundos.
         *
         * No hacemos stop aquí.
         */

        requestAnimationFrame(
            () => {

                if (experienceStarted) {

                    const start =
                        performance.now();


                    function loopProgress(now) {

                        let progress =
                            (
                                now - start
                            ) / 15000;


                        if (progress > 1)
                            progress = 1;


                        const percent =
                            Math.floor(
                                progress * 100
                            );


                        if (progressBar) {

                            progressBar.style.width =
                                percent + "%";

                        }


                        if (percentage) {

                            percentage.textContent =
                                percent + "%";

                        }


                        if (progress >= 1) {

                            finishCycle();

                        } else {

                            requestAnimationFrame(
                                loopProgress
                            );

                        }

                    }


                    requestAnimationFrame(
                        loopProgress
                    );

                }

            }
        );

    }

});
</script>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Video playback speed
            const video = document.getElementById('bg-video');
            if(video) {
                video.playbackRate = 0.16;
                video.play().catch(e => console.log('Auto-play prevented:', e));
            }

            // Parallax Effect
            const bg = document.getElementById('parallax-bg');
            const fg = document.getElementById('parallax-fg');
            
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
                
                bg.style.transform = `translate(${xAxis}px, ${yAxis}px)`;
                fg.style.transform = `translate(${-xAxis * 0.5}px, ${-yAxis * 0.5}px)`;
            });

            // Particle System (Embers)
            const particlesContainer = document.getElementById('particles-container');
            const createParticle = () => {
                const particle = document.createElement('div');
                particle.classList.add('ember');
                
                // Random properties
                const size = Math.random() * 3 + 1;
                const left = Math.random() * 100;
                const duration = Math.random() * 5 + 3;
                const delay = Math.random() * 2;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${left}%`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;
                
                particlesContainer.appendChild(particle);
                
                // Cleanup
                setTimeout(() => {
                    particle.remove();
                }, (duration + delay) * 1000);
            };

            // Generate initial particles
            for(let i=0; i<30; i++) {
                setTimeout(createParticle, Math.random() * 3000);
            }
            setInterval(createParticle, 200);

            // Loading Logic
            const progressBar = document.getElementById('progress-bar');
            const percentageText = document.getElementById('loading-percentage');
            const statusText = document.getElementById('loading-status');
            const terminalLogs = document.getElementById('terminal-logs');
            const ctaContainer = document.getElementById('cta-container');
            
            const stages = [
                'SYNCING SOUL SIGNATURE...',
                'CALIBRATING VOID RESONANCE...',
                'DECODING PROTOCOL 7-DELTA',
                'ESTABLISHING NEURAL LINK...',
                'BREACHING TARTARUS GATEWAY...'
            ];
            
            const technicalLogs = [
                '> root_access: granted',
                '> loading_module: mnemosyne_core.sys',
                '> mem_alloc: 0x8F92A',
                '> warn: temporal_distortion_detected',
                '> bypass_security: true',
                '> init_render_engine: hds_v2.4'
            ];

            let progress = 0;
            let currentStage = 0;
            
            const updateLogs = () => {
                if(Math.random() > 0.5) {
                    const log = document.createElement('div');
                    log.textContent = technicalLogs[Math.floor(Math.random() * technicalLogs.length)] + ` [${Math.random().toString(16).substr(2, 6)}]`;
                    terminalLogs.appendChild(log);
                    if(terminalLogs.children.length > 3) {
                        terminalLogs.removeChild(terminalLogs.firstChild);
                    }
                }
            };

            const startLoadingTimer = (totalDurationMs) => {
                const updateInterval = 100;
                const totalSteps = totalDurationMs / updateInterval;
                const increment = 100 / totalSteps;

                const simulateLoading = setInterval(() => {
                    progress += increment;
                    
                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(simulateLoading);
                        
                        statusText.textContent = 'SYSTEM ONLINE. AWAITING COMMAND.';
                        statusText.classList.replace('text-primary', 'text-tertiary');
                        progressBar.classList.replace('bg-secondary-container', 'bg-tertiary-container');
                        progressBar.style.boxShadow = '0 0 10px #5adcb3';
                        
                        // Show CTA
                        ctaContainer.classList.remove('hidden');
                        // Slight delay to allow display:block to apply before animating opacity
                        setTimeout(() => {
                            ctaContainer.classList.replace('opacity-0', 'opacity-100');
                            ctaContainer.classList.add('fade-in');
                            ctaContainer.classList.remove('pointer-events-none');
                        }, 50);
                    } else {
                        // Update Stage Text based on progress
                        const expectedStage = Math.floor((progress / 100) * stages.length);
                        if (expectedStage > currentStage && expectedStage < stages.length) {
                            currentStage = expectedStage;
                            statusText.textContent = stages[currentStage];
                        }
                        updateLogs();
                    }
                    
                    progressBar.style.width = `${progress}%`;
                    percentageText.textContent = `${Math.floor(progress)}%`;
                    
                }, updateInterval);
            };

            if (video) {
                if (video.readyState >= 1) {
                    startLoadingTimer((video.duration / video.playbackRate) * 1000);
                } else {
                    video.addEventListener('loadedmetadata', () => {
                        startLoadingTimer((video.duration / video.playbackRate) * 1000);
                    });
                }
            } else {
                startLoadingTimer(10000); // Default 10 seconds if no video
            }
        });
    </script>
