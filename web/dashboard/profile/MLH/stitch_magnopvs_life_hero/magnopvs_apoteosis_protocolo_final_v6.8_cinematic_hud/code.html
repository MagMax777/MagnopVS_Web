<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_177');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;

// Cosmic Palette: Keter White and Infinity Gold
#define GOLD vec3(0.83, 0.68, 0.21)
#define WHITE vec3(1.0, 1.0, 1.0)
#define DEEP_VOID vec3(0.01, 0.01, 0.02)

float ring(vec2 uv, float radius, float width) {
    float d = length(uv);
    return smoothstep(width, 0.0, abs(d - radius));
}

vec2 rotate(vec2 p, float a) {
    float s = sin(a);
    float c = cos(a);
    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);
}

void main() {
    vec2 p = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / min(u_resolution.y, u_resolution.x);
    float t = u_time * 0.5;
    
    // Core expansion effect
    float dist = length(p);
    float bloom = 0.15 / dist;
    
    // Sacred Geometry: The Merkaba / Seed of Life
    float flower = 0.0;
    flower += ring(p, 0.4 + sin(t)*0.02, 0.005);
    
    for(float i = 0.0; i < 6.0; i++) {
        float angle = i * 1.04719755 + t * 0.2;
        vec2 center = vec2(cos(angle), sin(angle)) * 0.4;
        flower += ring(p - center, 0.4, 0.003);
    }
    
    // Ethereal strands / energy lines
    float strands = 0.0;
    vec2 pRot = rotate(p, t * 0.1);
    strands += pow(abs(sin(pRot.x * 10.0 + t)), 20.0) * 0.5;
    strands += pow(abs(cos(pRot.y * 10.0 - t)), 20.0) * 0.5;
    
    // Final Composition
    vec3 color = mix(DEEP_VOID, GOLD, flower);
    color += WHITE * bloom * (0.8 + 0.2 * sin(t * 2.0));
    color += GOLD * strands * (0.3 + 0.2 * cos(t));
    
    // Vignette
    color *= smoothstep(1.5, 0.4, dist);
    
    gl_FragColor = vec4(color, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_178');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
container.appendChild(renderer.domElement);

// Unified Avatar Geometry (A sophisticated crystalline structure)
const geometry = new THREE.IcosahedronGeometry(1.5, 2);
const material = new THREE.MeshPhongMaterial({
  color: 0xffffff,
  emissive: 0xd4af37,
  emissiveIntensity: 0.5,
  shininess: 100,
  wireframe: true,
  transparent: true,
  opacity: 0.8
});

const core = new THREE.Mesh(geometry, material);
scene.add(core);

// Inner core of pure light
const innerGeo = new THREE.SphereGeometry(0.6, 32, 32);
const innerMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const innerCore = new THREE.Mesh(innerGeo, innerMat);
scene.add(innerCore);

// Ambient and Point lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0xd4af37, 2, 10);
pointLight.position.set(2, 2, 2);
scene.add(pointLight);

camera.position.z = 5;

// Responsive resize
window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

function animate() {
  requestAnimationFrame(animate);
  
  const time = Date.now() * 0.001;
  
  core.rotation.x += 0.005;
  core.rotation.y += 0.008;
  
  // Pulse effect
  const scale = 1 + Math.sin(time * 2) * 0.1;
  core.scale.set(scale, scale, scale);
  innerCore.scale.set(scale * 0.8, scale * 0.8, scale * 0.8);
  
  renderer.render(scene, camera);
}

animate();
})();
</script>
