<canvas id="shader-canvas-ANIMATION_164" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_164');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;

void main() {
    vec2 uv = v_texCoord;
    vec2 p = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / min(u_resolution.y, u_resolution.x);
    
    // Rubedo Red base
    vec3 color1 = vec3(0.4, 0.0, 0.05); // Deep Crimson
    vec3 color2 = vec3(0.8, 0.1, 0.1);  // Alchemical Red
    vec3 color3 = vec3(1.0, 0.8, 0.2);  // Philosopher's Gold
    
    float t = u_time * 0.5;
    
    // Ethereal flow
    for(float i = 1.0; i < 4.0; i++){
        p.x += 0.3 / i * sin(i * 3.0 * p.y + t);
        p.y += 0.3 / i * cos(i * 3.0 * p.x + t);
    }
    
    float f = 0.5 + 0.5 * sin(p.x + p.y + t);
    vec3 finalColor = mix(color1, color2, f);
    
    // Add golden sparkles/sparks
    float sparks = pow(abs(sin(p.x * 10.0 + t) * cos(p.y * 10.0 - t)), 20.0);
    finalColor += color3 * sparks * 0.5;
    
    // Vignette
    float d = length(uv - 0.5);
    finalColor *= smoothstep(0.8, 0.2, d);
    
    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<div id="threejs-container-ANIMATION_165" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_165');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
container.appendChild(renderer.domElement);

// Rubedo Core Geometry (Nested Spheres & Rings)
const coreGroup = new THREE.Group();
scene.add(coreGroup);

// Outer Energy Shell
const shellGeo = new THREE.SphereGeometry(2, 32, 32);
const shellMat = new THREE.MeshPhongMaterial({
    color: 0xff3300,
    transparent: true,
    opacity: 0.2,
    wireframe: true,
    emissive: 0x990000
});
const shell = new THREE.Mesh(shellGeo, shellMat);
coreGroup.add(shell);

// Inner Core (Philosopher's Stone)
const stoneGeo = new THREE.OctahedronGeometry(0.8, 0);
const stoneMat = new THREE.MeshPhongMaterial({
    color: 0xff0000,
    emissive: 0x660000,
    shininess: 100,
    flatShading: true
});
const stone = new THREE.Mesh(stoneGeo, stoneMat);
coreGroup.add(stone);

// Orbital Rings
const ringGeo = new THREE.TorusGeometry(1.5, 0.02, 16, 100);
const ringMat = new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.6 });

const rings = [];
for (let i = 0; i < 3; i++) {
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.random() * Math.PI;
    ring.rotation.y = Math.random() * Math.PI;
    coreGroup.add(ring);
    rings.push(ring);
}

// Lighting
const light = new THREE.PointLight(0xffffff, 2, 10);
light.position.set(0, 0, 5);
scene.add(light);
const ambientLight = new THREE.AmbientLight(0x404040);
scene.add(ambientLight);

camera.position.z = 5;

function animate() {
    requestAnimationFrame(animate);
    
    const time = Date.now() * 0.001;
    
    coreGroup.rotation.y += 0.01;
    stone.rotation.x += 0.02;
    stone.rotation.z += 0.01;
    
    shell.scale.setScalar(1 + Math.sin(time * 2) * 0.05);
    
    rings.forEach((ring, i) => {
        ring.rotation.z += 0.01 * (i + 1);
        ring.rotation.x += 0.005 * (i + 1);
    });

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
})();
</script>
