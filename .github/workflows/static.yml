name: Deploy MagnopVS Web to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build website
        working-directory: web
        run: npm run build
      - name: Copy original frames
        working-directory: web
        run: |
          mkdir -p dist/web
          cp -a frames dist/web/frames
      - name: Remove server bundle
        working-directory: web
        run: rm -f dist/server.cjs dist/server.cjs.map
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Deploy
        uses: actions/deploy-pages@v5

